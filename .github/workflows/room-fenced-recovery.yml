name: ROOM Fenced Recovery Generation

on:
  workflow_dispatch:
    inputs:
      recovery_id:
        description: "Single-use recovery identifier"
        required: true
        type: string
      expected_head_sha:
        description: "Exact commit to generate from"
        required: true
        type: string
      manifest_revision:
        description: "Monotonic manifest revision"
        required: true
        type: string
      old_run_id:
        description: "Run fenced by this recovery"
        required: true
        type: string
      posted_history_urls:
        description: "Confirmed historical POSTED URLs to exclude before candidate selection"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: room-fenced-recovery-${{ inputs.recovery_id }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.sha == inputs.expected_head_sha
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact fenced revision
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_head_sha }}

      - name: Verify recovery fence
        run: |
          test "${GITHUB_SHA}" = "${{ inputs.expected_head_sha }}"
          test -n "${{ inputs.old_run_id }}"
          test -n "${{ inputs.recovery_id }}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate artifact without external writes
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_REFERER: ${{ secrets.RAKUTEN_REFERER }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SHEET_NAME: ${{ vars.SHEET_NAME || 'Sheet1' }}
          OUTPUT_SHEET_NAME: ${{ vars.OUTPUT_SHEET_NAME || '最新版_ROOM投稿_2026-06-19以降' }}
          GENERATION_MODE: fallback
          ENABLE_RELAXED_FALLBACK: ${{ vars.ENABLE_RELAXED_FALLBACK || 'true' }}
          STRICT_MIN_REVIEW_COUNT: ${{ vars.STRICT_MIN_REVIEW_COUNT || '100' }}
          STRICT_MIN_REVIEW_AVERAGE: ${{ vars.STRICT_MIN_REVIEW_AVERAGE || '4.3' }}
          STRICT_PRIORITY_TOTAL_SCORE: ${{ vars.STRICT_PRIORITY_TOTAL_SCORE || '70' }}
          STRICT_MIN_TOTAL_SCORE: ${{ vars.STRICT_MIN_TOTAL_SCORE || '60' }}
          RELAXED_MIN_REVIEW_COUNT: ${{ vars.RELAXED_MIN_REVIEW_COUNT || '30' }}
          RELAXED_MIN_REVIEW_AVERAGE: ${{ vars.RELAXED_MIN_REVIEW_AVERAGE || '4.0' }}
          RELAXED_MIN_TOTAL_SCORE: ${{ vars.RELAXED_MIN_TOTAL_SCORE || '40' }}
          ROOM_SHADOW_MODE: "true"
          ROOM_RECOVERY_ID: ${{ inputs.recovery_id }}
          ROOM_GENERATION_CHANNEL: local_fenced_recovery
          ROOM_MANIFEST_REVISION: ${{ inputs.manifest_revision }}
          ROOM_RECOVERY_OLD_RUN_ID: ${{ inputs.old_run_id }}
          ROOM_POSTED_HISTORY_URLS: ${{ inputs.posted_history_urls }}
        run: python src/main.py

      - name: Upload fenced recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-fenced-recovery-${{ inputs.recovery_id }}
          path: reports/*
          if-no-files-found: error
